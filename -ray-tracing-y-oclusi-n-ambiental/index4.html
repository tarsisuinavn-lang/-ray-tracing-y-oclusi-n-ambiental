<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Laboratorio de render · Medición y Comparación (Integrante 4)</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
  canvas{background:#000;image-rendering:pixelated;width:640px;height:400px;border:1px solid #444}
  #panel{max-width:380px;line-height:1.5}
  kbd{background:#333;border:1px solid #555;border-radius:3px;padding:0 5px}
  table{border-collapse:collapse;font-size:12px;width:100%;margin-top:10px}td,th{border:1px solid #444;padding:4px 6px;text-align:center}
  .ok{color:#7f7}
  select, button {background:#222;color:#eee;border:1px solid #555;padding:4px 8px;border-radius:4px;cursor:pointer;margin:4px 0}
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<div id="panel">
  <h3>Laboratorio de Renderizado - Integración</h3>
  <p>
    <label>Técnica: 
      <select id="selModo" onchange="cambiarModo()">
        <option value="1">1. Scanline (Integrante 1)</option>
        <option value="2" selected>2. Ray Tracing (Integrante 2)</option>
        <option value="3">3. Ray Tracing + AO (Integrante 3)</option>
      </select>
    </label>
  </p>
  <p>
    <label>Resolución: 
      <select id="selRes" onchange="cambiarResolucion()">
        <option value="1">320 × 200</option>
        <option value="2">640 × 400</option>
      </select>
    </label>
    &nbsp; <button onclick="limpiarTabla()">Limpiar Tabla</button>
  </p>
  <p><kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> cambiar modo &nbsp; <kbd>S</kbd> sombras &nbsp; <kbd>+</kbd>/<kbd>-</kbd> AO</p>
  <p id="info"></p>
  <table id="tabla">
    <tr><th>Modo</th><th>Res.</th><th>AO/Sombras</th><th>ms</th></tr>
  </table>
</div>
<script>
// ====== ESCENA COMÚN (Esferas, Cilindro, Piso, Luz) ======
const escena = {
  esferas: [
    { c:[ 0.0, 0.0, 5.0], r:1.0, color:[1.0,0.3,0.3], especular: 0.5 },
    { c:[-2.2, 0.3, 6.5], r:1.3, color:[0.3,1.0,0.4], especular: 0.2 }
  ],
  cilindro: { c:[ 2.0, -0.2, 4.5], r:0.7, h:1.8, color:[0.2,0.6,1.0], especular: 0.4 },
  pisoY: -1.0,
  luz: norm([-1, 2, -1.5])
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let modo = 2, sombras = true, muestrasAO = 16, escala = 1;

// ====== Vectores ======
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function mul(a,s){return [a[0]*s,a[1]*s,a[2]*s];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2]);return [a[0]/l,a[1]/l,a[2]/l];}

// ====== INTERSECCIONES ======
function intersectaEsfera(o, d, e){
  const oc = sub(o, e.c);
  const b = dot(d, oc);
  const k = dot(oc, oc) - e.r * e.r;
  const disc = b * b - k;
  if (disc < 0) return Infinity;
  let t = -b - Math.sqrt(disc);
  if (t < 0) t = -b + Math.sqrt(disc);
  return t > 0.001 ? t : Infinity;
}

function intersectaCilindro(o, d, cil) {
  let mejorT = Infinity;
  let normal = [0, 1, 0];
  const ocx = o[0] - cil.c[0], ocz = o[2] - cil.c[2];
  const dx = d[0], dz = d[2];
  const a = dx * dx + dz * dz;

  if (Math.abs(a) > 1e-6) {
    const b = ocx * dx + ocz * dz;
    const c = ocx * ocx + ocz * ocz - cil.r * cil.r;
    const disc = b * b - a * c;
    if (disc >= 0) {
      const sqrtDisc = Math.sqrt(disc);
      for (let t of [(-b - sqrtDisc) / a, (-b + sqrtDisc) / a]) {
        if (t > 0.001 && t < mejorT) {
          const py = o[1] + t * d[1];
          if (py >= cil.c[1] - cil.h/2 && py <= cil.c[1] + cil.h/2) {
            mejorT = t;
            normal = norm([o[0] + t*d[0] - cil.c[0], 0, o[2] + t*d[2] - cil.c[2]]);
          }
        }
      }
    }
  }

  for (let [yPlano, nPlano] of [[cil.c[1] - cil.h/2, [0,-1,0]], [cil.c[1] + cil.h/2, [0,1,0]]]) {
    if (Math.abs(d[1]) > 1e-6) {
      const tPlano = (yPlano - o[1]) / d[1];
      if (tPlano > 0.001 && tPlano < mejorT) {
        const px = o[0] + tPlano * d[0], pz = o[2] + tPlano * d[2];
        if (Math.hypot(px - cil.c[0], pz - cil.c[2]) <= cil.r) {
          mejorT = tPlano;
          normal = nPlano;
        }
      }
    }
  }
  return { t: mejorT, n: normal };
}

function intersectaPiso(o, d){
  if (Math.abs(d[1]) < 1e-6) return Infinity;
  const t = (escena.pisoY - o[1]) / d[1];
  return t > 1e-3 ? t : Infinity;
}

function trazar(o, d){
  let mejor = { t: Infinity };
  for (const e of escena.esferas){
    const t = intersectaEsfera(o, d, e);
    if (t < mejor.t) mejor = { t, p: add(o, mul(d,t)), n: norm(sub(add(o, mul(d,t)), e.c)), color: e.color, especular: e.especular };
  }
  const resCil = intersectaCilindro(o, d, escena.cilindro);
  if (resCil.t < mejor.t) mejor = { t: resCil.t, p: add(o, mul(d, resCil.t)), n: resCil.n, color: escena.cilindro.color, especular: escena.cilindro.especular };
  
  const tp = intersectaPiso(o, d);
  if (tp < mejor.t){
    const p = add(o, mul(d,tp));
    const cuadro = (Math.floor(p[0]) + Math.floor(p[2])) & 1;
    mejor = { t: tp, p, n:[0,1,0], color: cuadro ? [0.8,0.8,0.8] : [0.35,0.35,0.35], especular: 0.1 };
  }
  return mejor;
}

function enSombra(p, n){
  return trazar(add(p, mul(n, 0.001)), escena.luz).t < Infinity;
}

function oclusionAmbiental(p, n, N){
  let libres = 0;
  for (let i = 0; i < N; i++){
    let d = norm([Math.random()*2-1, Math.random()*2-1, Math.random()*2-1]);
    if (dot(d, n) < 0) d = mul(d, -1);
    if (trazar(add(p, mul(n, 0.001)), d).t > 2.0) libres++;
  }
  return libres / N;
}

function sombrear(h, conAO){
  if (h.t === Infinity) return [0.15, 0.2, 0.35];
  let lambert = Math.max(0, dot(h.n, escena.luz));
  if (sombras && lambert > 0 && enSombra(h.p, h.n)) lambert = 0;
  
  let col = mul(h.color, 0.25 * (conAO ? oclusionAmbiental(h.p, h.n, muestrasAO) : 1) + 0.75 * lambert);
  
  if (h.especular > 0 && modo === 2) {
    const dRefl = sub(escena.luz, mul(h.n, 2 * dot(escena.luz, h.n)));
    const hRefl = trazar(add(h.p, mul(h.n, 0.001)), norm(dRefl));
    if (hRefl.t !== Infinity) col = add(col, mul(hRefl.color, 0.5 * h.especular));
  }
  return col;
}

// ====== MÉTODOS DE RENDERIZADO ======
function renderRayTracing(conAO){
  const W = cv.width, H = cv.height, img = ctx.createImageData(W, H);
  const ojo = [0, 0.3, 0], fov = 1.0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const u = (2*(x+0.5)/W - 1) * fov * W/H, v = (1 - 2*(y+0.5)/H) * fov;
    const col = sombrear(trazar(ojo, norm([u, v, 1.5])), conAO);
    const i = 4*(y*W + x);
    img.data[i] = Math.min(255, col[0]*255); img.data[i+1] = Math.min(255, col[1]*255);
    img.data[i+2] = Math.min(255, col[2]*255); img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function renderScanline(){
  const W = cv.width, H = cv.height, img = ctx.createImageData(W, H);
  const zbuf = new Float32Array(W*H).fill(Infinity);
  const ojo = [0, 0.3, 0], f = 1.5 / 1.0;
  const pix = (x,y,col)=>{const i=4*(y*W+x);img.data[i]=col[0]*255;img.data[i+1]=col[1]*255;img.data[i+2]=col[2]*255;img.data[i+3]=255;};
  
  for (let y = 0; y < H; y++){
    const v = 1 - 2*(y+0.5)/H;
    for (let x = 0; x < W; x++) pix(x, y, [0.15,0.2,0.35]);
    if (v < 0){
      const z = (escena.pisoY - ojo[1]) / (v / f);
      for (let x = 0; x < W; x++){
        const u = (2*(x+0.5)/W - 1) * W/H;
        const px = u / f * z, cuadro = (Math.floor(px) + Math.floor(z)) & 1;
        const c = cuadro ? 0.8 : 0.35, l = 0.25 + 0.75*Math.max(0, escena.luz[1]);
        pix(x, y, [c*l, c*l, c*l]); zbuf[y*W+x] = z;
      }
    }
  }

  for (const e of escena.esferas){
    const z = e.c[2], cx = (e.c[0]/z*f) / (W/H), cy = (e.c[1]-ojo[1])/z*f, rr = e.r/z*f;
    const sx = (cx+1)/2*W, sy = (1-cy)/2*H, sr = rr/2*H;
    for (let y = Math.max(0, Math.floor(sy-sr)); y < Math.min(H, Math.ceil(sy+sr)); y++){
      const dy = (y+0.5 - sy)/sr; if (Math.abs(dy) > 1) continue;
      const half = Math.sqrt(1 - dy*dy) * sr;
      for (let x = Math.max(0, Math.floor(sx-half)); x < Math.min(W, Math.ceil(sx+half)); x++){
        const dx = (x+0.5 - sx)/sr, nz = -Math.sqrt(Math.max(0, 1-dx*dx-dy*dy));
        const zp = z + nz*e.r;
        if (zp < zbuf[y*W+x]){
          zbuf[y*W+x] = zp;
          const l = 0.25 + 0.75*Math.max(0, dot([dx, -dy, nz], escena.luz));
          pix(x, y, mul(e.color, l));
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ====== CONTROL Y MEDICIÓN DE TIEMPOS (Integrante 4) ======
const nombres = {1:'Scanline', 2:'Ray Tracing', 3:'Ray Tracing + AO'};
function render(){
  const t0 = performance.now();
  if (modo === 1) renderScanline();
  else renderRayTracing(modo === 3);
  const ms = (performance.now() - t0).toFixed(1);

  document.getElementById('selModo').value = modo;
  document.getElementById('info').innerHTML =
    `<b>${nombres[modo]}</b> · ${cv.width}×${cv.height} · <span class="ok">${ms} ms</span>`;
  
  document.getElementById('tabla').insertAdjacentHTML('beforeend',
    `<tr><td>${nombres[modo]}</td><td>${cv.width}×${cv.height}</td><td>${modo===3?muestrasAO:(sombras?'Sombras Sí':'No')}</td><td>${ms} ms</td></tr>`);
}

function cambiarModo(){
  modo = +document.getElementById('selModo').value;
  render();
}

function cambiarResolucion(){
  escala = +document.getElementById('selRes').value;
  cv.width = 320 * escala; cv.height = 200 * escala;
  render();
}

function limpiarTabla(){
  document.getElementById('tabla').innerHTML = '<tr><th>Modo</th><th>Res.</th><th>AO/Sombras</th><th>ms</th></tr>';
}

addEventListener('keydown', ev => {
  if ('123'.includes(ev.key)) { modo = +ev.key; render(); }
  else if (ev.key.toLowerCase() === 's') { sombras = !sombras; render(); }
  else if (ev.key === '+') { muestrasAO = Math.min(128, muestrasAO * 2); render(); }
  else if (ev.key === '-') { muestrasAO = Math.max(1, muestrasAO / 2); render(); }
});

render();
</script>
</body>
</html>
